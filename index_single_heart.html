<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I Love You Niv ❤️</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="heart"></canvas>

  <script>
    const canvas = document.getElementById("heart");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    function heartPoint(t) {
      return {
        x: 16 * Math.pow(Math.sin(t), 3),
        y: 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)
      };
    }

    const totalPoints = 120;
    const points = [];
    for (let i = 0; i < totalPoints; i++) {
      const t = (i * Math.PI * 2) / totalPoints;
      points.push(heartPoint(t));
    }

    let index = 0;
    let frame = 0;

    function draw() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.18)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const scale = Math.min(canvas.width, canvas.height) / 38;
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      ctx.fillStyle = "#ffb6c1";
      ctx.font = "bold 11px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      // Draw only the points already "revealed"
      for (let i = 0; i <= index; i++) {
        const p = points[i];
        const x = cx + p.x * scale;
        const y = cy - p.y * scale;
        ctx.fillText("I love you Niv", x, y);
      }

      // Make it draw gradually, point by point
      frame++;
      if (frame % 2 === 0 && index < totalPoints - 1) {
        index++;
      } else if (index >= totalPoints - 1) {
        // pause at full heart, then restart
        if (frame > totalPoints * 3) {
          index = 0;
          frame = 0;
        }
      }

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
