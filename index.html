<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>I Love You Niv ❤️</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    canvas {
        display: block;
    }
</style>
</head>

<body>
<canvas id="heart"></canvas>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let scale = Math.min(canvas.width, canvas.height) / 38;

function heart(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t)
        - 5 * Math.cos(2*t)
        - 2 * Math.cos(3*t)
        - Math.cos(4*t);

    return {
        x: canvas.width / 2 + x * scale,
        y: canvas.height / 2 - y * scale
    };
}

function draw() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ffb6c1";
    ctx.font = "bold 11px Arial";
    ctx.textAlign = "center";

    for (let s = 0.75; s <= 1.05; s += 0.05) {
        for (let i = 0; i < 120; i++) {
            const t = i * Math.PI * 2 / 120;
            const p = heart(t);

            const x = canvas.width / 2 + (p.x - canvas.width / 2) * s;
            const y = canvas.height / 2 + (p.y - canvas.height / 2) * s;

            ctx.fillText("I love you Niv", x, y);
        }
    }

    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
